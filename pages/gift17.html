<style id="birthday-home-button-style">
.birthday-home-button {
  position: fixed !important;
  top: 22px !important;
  right: 22px !important;
  left: auto !important;
  z-index: 999999 !important;

  width: 48px !important;
  height: 48px !important;
  padding: 0 !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  border-radius: 50% !important;
  border: 1px solid rgba(255,255,255,.30) !important;

  background: rgba(20,20,30,.72) !important;
  color: #fff !important;

  text-decoration: none !important;

  backdrop-filter: blur(14px) !important;
  -webkit-backdrop-filter: blur(14px) !important;

  box-shadow:
    0 8px 28px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.16) !important;

  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    border-color .25s ease !important;
}

.birthday-home-button:hover {
  transform: translateY(-3px) scale(1.08) !important;

  background: rgba(35,35,48,.90) !important;

  border-color: rgba(255,255,255,.55) !important;

  box-shadow:
    0 13px 34px rgba(0,0,0,.30),
    0 0 22px rgba(255,255,255,.12),
    inset 0 1px 0 rgba(255,255,255,.20) !important;
}

.birthday-home-button:active {
  transform: scale(.94) !important;
}

.birthday-home-button svg {
  width: 22px !important;
  height: 22px !important;
  display: block !important;
  fill: currentColor !important;
}

@media (max-width: 600px) {
  .birthday-home-button {
    top: 14px !important;
    right: 14px !important;
    width: 43px !important;
    height: 43px !important;
  }

  .birthday-home-button svg {
    width: 20px !important;
    height: 20px !important;
  }
}
</style>
