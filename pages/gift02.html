<script data-persistent-birthday-guard="v2">
(function () {

    /*
     * If this page is already inside the permanent birthday iframe,
     * do absolutely nothing.
     */
    if (window.top !== window.self) {
        return;
    }

    /*
     * Directly opening a child page would create a brand-new document
     * and therefore destroy persistent music.
     *
     * Send the visitor back to the permanent parent.
     *
     * The parent will still require the password.
     */
    var here = window.location.pathname;

    var marker = "/pages/";

    var index = here.lastIndexOf(marker);

    if (index === -1) {
        return;
    }

    var childPath =
        here.substring(index + 1);

    var depth =
        childPath.split("/").length - 1;

    var prefix = "";

    for (var i = 0; i < depth + 1; i++) {
        prefix += "../";
    }

    var destination =
        prefix +
        "index.html?open=" +
        encodeURIComponent(childPath);

    window.location.replace(destination);

})();
</script>

<script id="open-when-modal-js">
(() => {

  const cards = document.querySelectorAll(".ow-card");

  if (!cards.length) return;

  /*
   * One reusable modal.
   * Clicking a card opens it in the exact center of the viewport.
   * Closing returns to the 18-card page.
   */

  const modal = document.createElement("div");

  modal.className = "ow-modal";

  modal.innerHTML = `
    <div class="ow-modal-window" role="dialog" aria-modal="true">

      <div class="ow-modal-head">

        <span class="ow-modal-label">
          ZEEL × VRUSH · OPEN WHEN
        </span>

        <button
          class="ow-modal-close"
          type="button"
          aria-label="Close letter"
        >×</button>

      </div>

      <div class="ow-modal-content">

        <h2 class="ow-modal-title"></h2>

        <div class="ow-modal-body"></div>

        <div class="ow-modal-note">

          <label></label>

          <textarea
            class="ow-modal-textarea"
            placeholder="Write anything you want me to know..."
          ></textarea>

          <div class="ow-modal-actions">

            <button
              class="ow-save"
              type="button"
            >Save my note</button>

            <button
              class="ow-clear"
              type="button"
            >Clear</button>

            <span
              class="ow-saved"
              aria-live="polite"
            ></span>

          </div>

        </div>

      </div>

    </div>
  `;

  document.body.appendChild(modal);

  const windowBox =
    modal.querySelector(".ow-modal-window");

  const title =
    modal.querySelector(".ow-modal-title");

  const body =
    modal.querySelector(".ow-modal-body");

  const label =
    modal.querySelector(".ow-modal-note label");

  const textarea =
    modal.querySelector(".ow-modal-textarea");

  const closeButton =
    modal.querySelector(".ow-modal-close");

  const saveButton =
    modal.querySelector(".ow-save");

  const clearButton =
    modal.querySelector(".ow-clear");

  const saved =
    modal.querySelector(".ow-saved");

  let currentKey = null;

  function openModal(card){

    const number =
      card.dataset.card;

    const cardTitle =
      card.querySelector(".ow-title").textContent.trim();

    const content =
      card.querySelector(".ow-content").content.cloneNode(true);

    title.textContent =
      cardTitle;

    body.innerHTML = "";

    body.appendChild(content);

    label.textContent =
      "Your little note to me";

    currentKey =
      "zeel_vrush_open_when_" + number;

    const previous =
      localStorage.getItem(currentKey);

    textarea.value =
      previous !== null ? previous : "";

    saved.textContent = "";

    modal.classList.add("is-open");

    document.body.style.overflow =
      "hidden";

    windowBox.scrollTop = 0;

    setTimeout(() => {
      closeButton.focus();
    }, 80);
  }

  function closeModal(){

    modal.classList.remove("is-open");

    document.body.style.overflow = "";

    currentKey = null;

  }

  cards.forEach(card => {

    const button =
      card.querySelector(".ow-envelope");

    button.addEventListener(
      "click",
      () => openModal(card)
    );

  });

  closeButton.addEventListener(
    "click",
    closeModal
  );

  modal.addEventListener(
    "click",
    event => {

      if (event.target === modal){
        closeModal();
      }

    }
  );

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape" &&
        modal.classList.contains("is-open")
      ){
        closeModal();
      }

    }
  );

  saveButton.addEventListener(
    "click",
    () => {

      if (!currentKey) return;

      localStorage.setItem(
        currentKey,
        textarea.value
      );

      saved.textContent =
        "Saved ♥";

      setTimeout(
        () => saved.textContent = "",
        1800
      );

    }
  );

  clearButton.addEventListener(
    "click",
    () => {

      if (!currentKey) return;

      textarea.value = "";

      localStorage.removeItem(
        currentKey
      );

      saved.textContent =
        "Cleared";

      setTimeout(
        () => saved.textContent = "",
        1800
      );

    }
  );

})();
</script>
