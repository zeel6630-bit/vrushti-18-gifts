<script data-persistent-birthday-guard="v2">
(function () {

    /*
     * If this page is already inside the permanent birthday iframe,
     * do absolutely nothing.
     */
    if (window.top !== window.self) {
        return;
    }

    /*
     * Directly opening a child page would create a brand-new document
     * and therefore destroy persistent music.
     *
     * Send the visitor back to the permanent parent.
     *
     * The parent will still require the password.
     */
    var here = window.location.pathname;

    var marker = "/pages/";

    var index = here.lastIndexOf(marker);

    if (index === -1) {
        return;
    }

    var childPath =
        here.substring(index + 1);

    var depth =
        childPath.split("/").length - 1;

    var prefix = "";

    for (var i = 0; i < depth + 1; i++) {
        prefix += "../";
    }

    var destination =
        prefix +
        "index.html?open=" +
        encodeURIComponent(childPath);

    window.location.replace(destination);

})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gift 12 — Tumhare Naam</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');

*{box-sizing:border-box}

:root{
  --night:#101016;
  --plum:#211821;
  --rose:#c98f9e;
  --rose-soft:#e7bbc5;
  --gold:#d8b879;
  --cream:#f7ead8;
  --muted:#a99da2;
  --line:rgba(247,234,216,.12);
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--night);
  color:var(--cream);
  font-family:"DM Sans",sans-serif;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 15%,rgba(201,143,158,.14),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(216,184,121,.06),transparent 28%),
    linear-gradient(145deg,#0c0c11,#171219 55%,#0d0d12);
}

/* ambient background */
.ambient{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.12;
  animation:drift 15s ease-in-out infinite alternate;
}

.glow.one{
  background:#b66d82;
  left:-180px;
  top:10%;
}

.glow.two{
  background:#c9a45f;
  right:-200px;
  bottom:0;
  animation-delay:-6s;
}

.glow.three{
  background:#8b6072;
  width:280px;
  height:280px;
  left:45%;
  top:45%;
  animation-delay:-3s;
}

@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(90px,-55px) scale(1.15)}
}

/* floating dust */
.dust{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:rgba(247,234,216,.55);
  animation:floatDust linear infinite;
}

@keyframes floatDust{
  from{transform:translateY(105vh) translateX(0);opacity:0}
  15%{opacity:.7}
  85%{opacity:.45}
  to{transform:translateY(-10vh) translateX(60px);opacity:0}
}

.page{
  position:relative;
  z-index:2;
  width:min(1120px,92%);
  margin:auto;
  min-height:100vh;
  padding:34px 0 55px;
}

/* top */
.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
}

.eyebrow{
  color:var(--gold);
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:10px;
}

.title{
  margin:0;
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(42px,7vw,78px);
  line-height:.9;
  font-weight:500;
  letter-spacing:-2px;
}

.subtitle{
  margin:13px 0 0;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.4px;
}

.number{
  min-width:74px;
  height:74px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  background:rgba(255,255,255,.025);
}

/* main shayari area */
.stage{
  position:relative;
  margin:55px auto 30px;
  max-width:820px;
  min-height:470px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  position:relative;
  width:min(780px,100%);
  min-height:430px;
  padding:65px 70px 55px;
  border:1px solid rgba(231,187,197,.17);
  border-radius:5px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),
    rgba(20,16,21,.82);
  box-shadow:
    0 35px 100px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.04);
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.card:before,
.card:after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-color:rgba(216,184,121,.4);
  pointer-events:none;
}

.card:before{
  left:22px;
  top:22px;
  border-left:1px solid;
  border-top:1px solid;
}

.card:after{
  right:22px;
  bottom:22px;
  border-right:1px solid;
  border-bottom:1px solid;
}

.ornament{
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:24px;
  opacity:.75;
  margin-bottom:20px;
}

.mood{
  display:inline-block;
  align-self:center;
  padding:7px 13px;
  border:1px solid rgba(201,143,158,.25);
  border-radius:999px;
  color:var(--rose-soft);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:27px;
}

.shayari{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(26px,4vw,42px);
  line-height:1.42;
  font-weight:500;
  letter-spacing:.1px;
  color:#f6e9da;
  text-wrap:balance;
}

.shayari .line{
  display:block;
}

.signature{
  margin-top:30px;
  color:#9c8d92;
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
}

.signature span{
  color:var(--rose-soft);
}

.progress{
  position:absolute;
  left:50%;
  bottom:-34px;
  transform:translateX(-50%);
  color:#756c71;
  font-size:10px;
  letter-spacing:2px;
  white-space:nowrap;
}

.progress b{
  color:var(--gold);
  font-weight:500;
}

/* controls */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:58px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid rgba(247,234,216,.12);
  background:rgba(255,255,255,.035);
  color:#d8cbc8;
  border-radius:999px;
  padding:11px 17px;
  cursor:pointer;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:.25s ease;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:rgba(231,187,197,.35);
  background:rgba(231,187,197,.07);
}

.btn.main{
  background:rgba(201,143,158,.15);
  border-color:rgba(201,143,158,.32);
  color:var(--rose-soft);
  min-width:145px;
}

/* bottom */
.bottom{
  text-align:center;
  margin-top:52px;
  color:#625b60;
  font-size:10px;
  letter-spacing:1px;
}

.bottom span{
  color:#91747d;
}

/* transitions */
.card.change{
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
  0%{
    opacity:0;
    transform:translateY(18px) scale(.985);
    filter:blur(5px)
  }
  100%{
    opacity:1;
    transform:none;
    filter:blur(0)
  }
}

.shimmer{
  position:absolute;
  top:-30%;
  left:-20%;
  width:20%;
  height:160%;
  transform:rotate(18deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.035),
    transparent
  );
  animation:shimmer 9s ease-in-out infinite;
}

@keyframes shimmer{
  0%,65%{left:-30%}
  100%{left:130%}
}

/* mobile */
@media(max-width:650px){
  .page{padding-top:24px}

  .number{
    width:55px;
    min-width:55px;
    height:55px;
    font-size:21px;
  }

  .title{
    font-size:48px;
  }

  .stage{
    margin-top:38px;
    min-height:480px;
  }

  .card{
    min-height:440px;
    padding:55px 25px 45px;
  }

  .shayari{
    font-size:29px;
    line-height:1.48;
  }

  .card:before{
    left:13px;
    top:13px;
  }

  .card:after{
    right:13px;
    bottom:13px;
  }

  .progress{
    bottom:-28px;
  }
}

@media(max-width:400px){
  .top{gap:8px}
  .title{font-size:42px}
  .shayari{font-size:27px}
}
</style>

<body>

<div class="ambient">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>
</div>

<script>
for(let i=0;i<32;i++){
  const d=document.createElement("div");
  d.className="dust";
  d.style.left=Math.random()*100+"%";
  d.style.animationDuration=(9+Math.random()*15)+"s";
  d.style.animationDelay=(-Math.random()*18)+"s";
  d.style.opacity=(.25+Math.random()*.45);
  document.querySelector(".ambient").appendChild(d);
}
</script>

<div class="page">

  <header class="top">
    <div>
      <div class="eyebrow">Gift 12 · Tumhare Naam</div>
      <h1 class="title">Kuch Alfaaz<br>Sirf Tumhare Liye</h1>
      <p class="subtitle">18 shayaris · ek dil · aur bahut saari mohabbat</p>
    </div>

    <div class="number">12</div>
  </header>

  <main>

    <section class="stage">

      <article class="card" id="card">
        <div class="shimmer"></div>

        <div class="ornament">✦</div>

        <div class="mood" id="mood">Mohabbat</div>

        <div class="shayari" id="shayari"></div>

        <div class="signature">
          — <span>tumhare Zeel ki taraf se</span>
        </div>

        <div class="progress">
          SHAYARI <b id="current">01</b> / 18
        </div>
      </article>

    </section>

    <div class="controls">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn main" id="random">Random Shayari</button>
      <button class="btn" id="next">Next →</button>
    </div>

  </main>

  <div class="bottom">
    <span>18 alfaaz</span> · har baar tum tak pahunchne ke liye
  </div>

</div>

<script>
const shayaris = [

{
mood:"Mohabbat",
text:[
"Na chaand ki khwahish, na sitaaron ki darkaar,",
"Bas tum muskura do, toh khoobsurat hai har bahaar."
]
},

{
mood:"Ishq",
text:[
"Tum paas raho toh har pal khaas lagta hai,",
"Tum door raho toh bhi dil tumhare paas lagta hai."
]
},

{
mood:"Flirty",
text:[
"Tumhe dekhu toh dil ka sukoon kho jaata hai,",
"Phir tum muskura do toh dil aur bhi tumhara ho jaata hai."
]
},

{
mood:"Cheesy",
text:[
"Chaai ho ya coffee, tum dono se pyaari ho,",
"Sach kahun toh meri har favourite cheez se bhi nyaari ho."
]
},

{
mood:"Dil Se",
text:[
"Khud se zyada tumhari fikr hone lagi hai,",
"Shayad isi ko mohabbat kehne lagi hai."
]
},

{
mood:"Tum Aur Main",
text:[
"Na koi shart ho, na koi hisaab ho,",
"Bas tum mere paas aur mera har khwaab tumhare saath ho."
]
},

{
mood:"Thodi Si Shararat",
text:[
"Teri aankhon mein kuch aisi baat hai,",
"Ek baar dekh loon toh phir dekhne ki hi baat hai."
]
},

{
mood:"Yaad",
text:[
"Jab tum yaad aati ho toh waqt tham sa jaata hai,",
"Ek chhota sa message bhi chehre pe smile laata hai."
]
},

{
mood:"Dooriyan",
text:[
"Faasle chahe kitne bhi darmiyaan aa jaayein,",
"Dil wohi rahega jo har baar tum tak laut aaye."
]
},

{
mood:"Forever",
text:[
"Kal ki fikr nahi, aaj ka khwaab tum ho,",
"Jo bhi ho mera kal, usmein ek naam tum ho."
]
},

{
mood:"Cute",
text:[
"Tum thodi si pagal, thodi si pyaari ho,",
"Par sach bolun toh meri duniya ki sabse nyaari ho."
]
},

{
mood:"Dil Ki Baat",
text:[
"Log poochte hain itni mohabbat kyun hai tumse,",
"Kaise samjhaun, mera dil hi bana hai tumse."
]
},

{
mood:"Romantic",
text:[
"Ek tum ho jise dekh kar dil ko karaar aata hai,",
"Ek tumhara naam hai jo har dua mein baar-baar aata hai."
]
},

{
mood:"Teasing",
text:[
"Tum rooth jao toh manaana bhi achha lagta hai,",
"Tum maan jao toh jeet jaana bhi achha lagta hai."
]
},

{
mood:"Soft Love",
text:[
"Na bade vaade chahiye, na koi kahaani chahiye,",
"Mujhe bas har kal mein thodi si tumhari nishaani chahiye."
]
},

{
mood:"Tumhari Muskaan",
text:[
"Teri hasi ka koi jawaab nahi,",
"Sach kahun toh usse khoobsurat mera koi khwaab nahi."
]
},

{
mood:"Forever Wala Ishq",
text:[
"Har mod par tera saath chahiye,",
"Zindagi chhoti sahi, par har pal tera saath chahiye."
]
},

{
mood:"Sirf Tum",
text:[
"Na duniya se kuch maanga, na sitaaron se kuch kaha,",
"Bas tum mili toh laga, dil ne jo maanga tha woh mil gaya."
]
}

];

let index=0;

const card=document.getElementById("card");
const mood=document.getElementById("mood");
const shayari=document.getElementById("shayari");
const current=document.getElementById("current");

function render(i,direction=1){

  index=(i+shayaris.length)%shayaris.length;

  card.classList.remove("change");
  void card.offsetWidth;
  card.classList.add("change");

  mood.textContent=shayaris[index].mood;
  current.textContent=String(index+1).padStart(2,"0");

  shayari.innerHTML=shayaris[index].text
    .map(line=>`<span class="line">${line}</span>`)
    .join("");
}

function next(){
  render(index+1,1);
}

function prev(){
  render(index-1,-1);
}

function randomShayari(){

  let nextIndex;

  do{
    nextIndex=Math.floor(Math.random()*shayaris.length);
  }while(nextIndex===index);

  render(nextIndex);
}

document.getElementById("next").addEventListener("click",next);
document.getElementById("prev").addEventListener("click",prev);
document.getElementById("random").addEventListener("click",randomShayari);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
  if(e.key===" "){
    e.preventDefault();
    randomShayari();
  }
});

let touchStartX=0;

document.addEventListener("touchstart",e=>{
  touchStartX=e.changedTouches[0].screenX;
},{passive:true});

document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].screenX-touchStartX;

  if(Math.abs(dx)>55){
    if(dx<0) next();
    else prev();
  }
},{passive:true});

render(0);
</script>

</body>
